name: Build database

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NIX_CONFIG: "accept-flake-config = true"

permissions:
  contents: write

jobs:
  build:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build database
        run: nix develop -c ./run.sh build

      - name: Publish database
        # Rename rather than write in place: Datasette holds the database
        # open, and install(1) truncates, so a reader can see a torn file
        # mid-write. The rename is atomic and still trips the path unit.
        run: |-
          install -Dm644 readingList.db /var/lib/datasette-sites/api-read/.readingList.db.new
          mv -f /var/lib/datasette-sites/api-read/.readingList.db.new /var/lib/datasette-sites/api-read/readingList.db

      - name: Commit database
        run: ./run.sh commit-db
