name: Append article to reading list

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the article
        required: true
      title:
        description: Title of the article
        required: true
      description:
        description: Description of the article
        required: false
      image:
        description: Social image of the article
        required: false

concurrency:
  group: append-to-reading-list

env:
  NIX_CONFIG: "accept-flake-config = true"

permissions:
  contents: write

jobs:
  append:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Append article
        env:
          RL_URL: ${{ inputs.url }}
          RL_TITLE: ${{ inputs.title }}
          RL_DESCRIPTION: ${{ inputs.description }}
          RL_IMAGE: ${{ inputs.image }}
        # A single nix develop for the whole append: each evaluation re-copies
        # the >2GiB tree into the store, and these steps mutate it.
        run: nix develop -c ./run.sh append

      - name: Commit and push
        run: |-
          git config user.name "Automated"
          git config user.email "actions@jamesst.one"
          git add readingList.csv .site
          git commit -m "Automated reading list update on $(date -u)" || exit 0
          git push origin HEAD:main
